<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tool — All In One Tools</title>
  <meta name="description" content="Tool gratis yang berjalan di browser Anda.">
  <meta name="theme-color" content="#F4EFE3">
  <link rel="canonical" href="https://example.com/">
  <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.json">

  <link rel="preconnect" href="https://fonts.bunny.net" crossorigin>
  <link rel="stylesheet" href="https://fonts.bunny.net/css?family=bricolage-grotesque:600,700|instrument-sans:400,500,700|jetbrains-mono:400,500|fraunces:600,700&display=swap">

  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/animations.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body data-page="tool">

  <a href="#main" class="skip-link">Langsung ke konten</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="/" aria-label="AIO Tools — Beranda">
        <img src="/assets/logo.svg" alt="" width="36" height="36">
        <span>AIO Tools</span>
      </a>
      <nav class="header-nav" aria-label="Navigasi utama">
        <a href="/">Beranda</a>
        <a href="/pages/about.html">Tentang</a>
        <a href="/pages/privacy.html">Privasi</a>
      </nav>
      <div class="header-actions">
        <button type="button" class="icon-btn" id="theme-toggle" aria-label="Ganti tema terang/gelap">
          <svg aria-hidden="true" id="theme-icon"><use href="/assets/icons.svg#i-moon"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="main" class="container">
    <div id="tool-root" aria-live="polite">
      <div class="tool-page-header">
        <div class="skel skel--text" style="width: 40%;"></div>
        <div class="skel skel--title" style="height: 44px; width: 65%; margin-top: 12px;"></div>
        <div class="skel skel--text" style="width: 80%; margin-top: 10px;"></div>
      </div>
      <div class="tool-panel">
        <div class="skel skel--input" style="height: 200px;"></div>
        <div class="skel skel--btn"></div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        <span>© <span id="year"></span> All In One Tools. Semua gratis.</span>
        <span><a href="/">Kembali ke beranda</a></span>
      </div>
    </div>
  </footer>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
